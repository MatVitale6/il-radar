massimo = 12      # pubblicate per esteso (le inglesi tradotte da MiniCPM, ~35 s l'una)
brevi = 10        # le successive, solo titolo, nella colonna "In breve"
copertura = 2     # punti in più per ogni altra testata che dà la stessa notizia
# Tre gruppi = tre rubriche. Una notizia finisce nella rubrica dove prende più punti, ma entra
# solo se tocca "tecnologia" o "sicurezza": una legge che non parla di digitale resta fuori.

