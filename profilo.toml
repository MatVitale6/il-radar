# Chi sei, per il radar.
# - `parole` decidono cosa finisce sul giornale: si sommano i pesi delle parole trovate in titolo
#   o abstract (plurali inclusi); il totale, tagliato a 10, è il voto. Pesi negativi = argomenti da
#   spingere giù. (Il modello locale si è dimostrato inaffidabile nel giudicare: fa solo i riassunti.)
# - `descrizione` è il promemoria umano di chi sei; per ora non la legge nessun modello.

descrizione = """
Matteo Vitale, ingegnere e sviluppatore freelance in Italia. Lavora su: sviluppo web e grafica 3D
(Vite, JavaScript, three.js, WebGL), automazioni e pipeline in Python, AI applicata (agenti LLM,
uso di strumenti, RAG, modelli piccoli che girano in locale), sicurezza informatica (sicurezza dei
sistemi AI, del web e del software). Preferisce lavori pratici, strumenti e tecniche usabili
subito; la teoria pura (dimostrazioni, limiti di convergenza) gli interessa poco.
"""

[pubblica]
soglia = 6        # voto minimo (0-10) per finire sul giornale
massimo = 15      # articoli al giorno riassunti da MiniCPM (~40 s l'uno sul tuo PC)
fondo = 20        # quanti dei successivi mostrare in fondo, solo titolo, per i tuoi giudizi

