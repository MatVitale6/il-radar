# Chi sei, per il radar. Il giornale ha tre parti, in quest'ordine: notizie, repository GitHub, ricerca.
#
# Come si scrivono le parole chiave (valgono in tutte le tabelle `parole`):
# - si cercano in titolo e testo; il peso si somma una volta per parola; pesi negativi = spingi giù
# - "parola" trova anche il plurale inglese (agent -> agents)
# - "radice*" trova tutte le terminazioni (regolament* -> regolamento, regolamenti, regolamentare)
# - le sigle TUTTE MAIUSCOLE contano solo scritte così ("AI" sì, la preposizione "ai" no);
#   tutto il resto ignora maiuscole e minuscole
#
# Il modello locale si è dimostrato inaffidabile nel giudicare: seleziona tutto il codice, lui traduce e riassume.

descrizione = """
Matteo Vitale, ingegnere e sviluppatore freelance in Italia. Lavora su: sviluppo web e grafica 3D
(Vite, JavaScript, three.js, WebGL), automazioni e pipeline in Python, AI applicata (agenti LLM,
uso di strumenti, RAG, modelli piccoli che girano in locale), sicurezza informatica (sicurezza dei
sistemi AI, del web e del software). Segue anche le notizie istituzionali: leggi e limiti sull'AI,
data center, attacchi informatici a paesi e aziende, sovranità digitale europea.
"""

[giornale]
fondo = 15        # quanti "rimasti fuori" mostrare in fondo, per i tuoi giudizi

[meteo]
citta = "Roma"
lat = 41.89
lon = 12.49

# ── 1. NOTIZIE ────────────────────────────────────────────────────────────────
[notizie]
ore = 36          # notizie più vecchie di così alla fonte non entrano
