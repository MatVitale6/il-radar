# ── 2. REPOSITORY GITHUB ──────────────────────────────────────────────────────
# I più seguiti dei tuoi temi (anche vecchi, anche già visti), ordinati per quanto crescono adesso:
# stelle guadagnate negli ultimi 7 giorni, dallo storico che il radar registra ogni giorno. Finché lo
# storico non c'è, la media di stelle al giorno dalla nascita. Spiegazione dal README, riassunto da MiniCPM.
[github]
massimo = 5
per_tema = 2      # al massimo tanti per tema, per non avere cinque agenti
